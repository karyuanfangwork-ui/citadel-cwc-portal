name: CI

on:
  push:
    branches: [main, develop, dev2.0]
  pull_request:
    branches: [main, develop, dev2.0]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 22

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  backend-typecheck:
    name: Backend TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_pw
          POSTGRES_DB: help_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://ci_test:ci_test_pw@localhost:5432/help_center_test?schema=public" >> "$GITHUB_ENV"
      - name: Set REDIS_URL
        run: echo "REDIS_URL=redis://localhost:6379" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run prisma:seed
      - run: npm test -- --forceExit --detectOpenHandles --verbose
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-typecheck
      - backend-test
      - frontend-build
      - frontend-test
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Backend Lint:       ${{ needs.backend-lint.result }}"
          echo "Backend TypeCheck:  ${{ needs.backend-typecheck.result }}"
          echo "Backend Test:       ${{ needs.backend-test.result }}"
          echo "Frontend Build:     ${{ needs.frontend-build.result }}"
          echo "Frontend Test:      ${{ needs.frontend-test.result }}"
          if [[ "${{ needs.backend-lint.result }}" == "failure" || \
                "${{ needs.backend-typecheck.result }}" == "failure" || \
                "${{ needs.backend-test.result }}" == "failure" || \
                "${{ needs.frontend-build.result }}" == "failure" || \
                "${{ needs.frontend-test.result }}" == "failure" ]]; then
            echo "::error::One or more CI checks failed"
            exit 1
          fi
          echo "All CI checks passed"
