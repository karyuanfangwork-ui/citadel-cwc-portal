name: Production Images

on:
  push:
    branches: [dev2.0]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: dev2.0
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: cgt-tech-admin

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    name: Build and publish backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: PDF_SMOKE_TEST=true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/citadel-cwc-portal-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/citadel-cwc-portal-backend:dev2.0-latest

  frontend-image:
    name: Build and publish frontend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VITE_API_URL=https://cwc.citadelgroup.com.my/api/v1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/citadel-cwc-portal-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/citadel-cwc-portal-frontend:dev2.0-latest
