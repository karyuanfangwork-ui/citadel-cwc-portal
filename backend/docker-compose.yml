version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: help-center-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: help_center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: help-center-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClamAV daemon for governed attachment malware scanning
  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    platform: linux/amd64
    container_name: help-center-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # S3-compatible object storage for local development.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: help-center-seaweedfs
    restart: unless-stopped
    command: mini -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: cwc-local
      AWS_SECRET_ACCESS_KEY: cwc-local-development-only
      S3_BUCKET: helpdesk-uploads
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Mailhog (Email testing - catches all emails)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: help-center-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clamav_data:
    driver: local
  seaweedfs_data:
    driver: local

networks:
  default:
    name: help-center-network
